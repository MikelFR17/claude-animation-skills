<style>
  @font-face { font-family: 'Cap'; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2') format('woff2'); font-weight: 800; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 720px; height: 1280px; overflow: hidden; }
  canvas { display: block; }
  /* one or two words, white, heavy, thick black outline, about 70% down the frame */
  #cap {
    position: absolute; left: 0; right: 0; top: 862px; text-align: center; transform-origin: 50% 50%;
    font: 800 50px/1.1 'Cap', sans-serif; color: #fff; letter-spacing: 0.2px;
    -webkit-text-stroke: 9px #0d0b0a; paint-order: stroke fill;
    text-shadow: 0 4px 0 #0d0b0a, 0 6px 14px rgba(0,0,0,.45);
  }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  #flash { position: absolute; inset: 0; background: #eaf3ff; opacity: 0; pointer-events: none; mix-blend-mode: screen; }
  #hud { position: fixed; left: 730px; top: 10px; color: #aaa; font: 13px monospace; }
</style>
